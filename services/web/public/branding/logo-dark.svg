  <!-- Wordmark -->
  <text x="310" y="152" font-family="'Helvetica Neue', 'Arial Black', 'Impact', sans-serif" font-size="92" font-weight="800" fill="#1a1a1a" text-anchor="start" dominant-baseline="middle" letter-spacing="-5">dBackSlash</text>
