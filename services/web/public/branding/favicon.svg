<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">DoubleBackSlash App Icon</title>
  <desc id="desc">DoubleBackSlash modern app icon with black palette</desc>
  
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="#1a1a1a"/>
  
  <!-- Subtle inner glow/shadow -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#innerGlow)"/>
  
  <!-- Subtle gradient overlay -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#gradientOverlay)" opacity="0.5"/>
  
  <!-- Main text: \\d -->
  <text x="256" y="320" font-family="'Helvetica Neue', 'Arial Black', 'Impact', sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-24">\\d</text>
  
  <!-- Defs for gradients -->
  <defs>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#333333" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="gradientOverlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#444444" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a2a2a" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>